
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time!</p>

        <form id="todo-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                autocomplete="off"
                required
            >
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        <p id="task-count">0 tasks remaining</p>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add one above!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
